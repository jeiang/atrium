version: "2"

run:
  go: "1.26"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - staticcheck
  settings:
    gosec:
      includes:
        - G402
    depguard:
      rules:
        anthropic-sdk:
          files:
            - $all
            - "!**/internal/anthropic/*.go"
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: only internal/anthropic talks to the Anthropic SDK (https://github.com/jeiang/atrium/issues/123)
