[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrium"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["sqlite-vec"]

[project.scripts]
atrium = "atrium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
