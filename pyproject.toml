[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrium"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["anthropic", "caldav", "fastapi", "google-api-python-client", "google-auth", "httpx", "icalendar", "jinja2", "markdown-it-py", "nh3", "openpyxl", "pydantic-monty", "python-docx", "python-multipart", "sqlite-vec", "trafilatura", "uvicorn", "vobject"]

[project.scripts]
atrium = "atrium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atrium.web" = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
