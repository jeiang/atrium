name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GARRET_SUBSTITUTER: https://cache.jeiang.dev
  GARRET_PUBLIC_KEY: "cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA="

  MAX_SUBSTITUTION_JOBS: "32"
  HTTP_CONNECTIONS: "64"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      - name: Discover checks
        id: discover
        run: |
          targets=$(nix eval --json '.#checks' --apply '
            checks: let
              runners = {
                x86_64-linux = "ubuntu-latest";
                aarch64-linux = "ubuntu-24.04-arm";
              };
            in
              builtins.concatMap
                (system: map (check: {inherit system check; runner = runners.${system};}) (builtins.attrNames checks.${system}))
                (builtins.attrNames runners)')
          if [ -z "$targets" ] || [ "$targets" = "[]" ]; then
            echo "::error::no checks discovered for the configured runners"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    name: build (${{ matrix.target.system }}.${{ matrix.target.check }})
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Write garret's post-build hook
        run: ./.ci/garret.sh hook

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}
            post-build-hook = ${{ runner.temp }}/garret-hook

      - name: Start pushing to garret as paths are built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.target.check != 'statix' && matrix.target.check != 'treefmt'
        continue-on-error: true
        run: ./.ci/garret.sh watch

      - name: Build check
        env:
          SYSTEM: ${{ matrix.target.system }}
          CHECK: ${{ matrix.target.check }}
        run: |
          nix build --keep-going --show-trace --no-link --print-out-paths \
            ".#checks.${SYSTEM}.${CHECK}" >"$RUNNER_TEMP/garret-outputs"

      - name: Push to garret what the watcher has not
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.target.check != 'statix' && matrix.target.check != 'treefmt'
        continue-on-error: true
        timeout-minutes: 30
        run: ./.ci/garret.sh drain

  check:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify discovery and all matrix checks passed
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "build:    ${{ needs.build.result }}"
          if [[ "${{ needs.discover.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
