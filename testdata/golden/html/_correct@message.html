



<form class="flex flex-col gap-3 rounded-md border border-dashed bg-background p-3"
      hx-post="/messages/502/correct"
      hx-target="#decision-card-502"
      hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  <input type="hidden" name="context" value="message">
  <div role="group" class="field">
    <label for="dest-message-502">Where should this go?</label>
    <select id="dest-message-502" name="dest" class="w-full sm:max-w-xs" required autofocus>
      <option value="" selected disabled>Choose a folder</option>
      
<option value="Receipts">Receipts</option>

<option value="Travel|Flights">Travel|Flights</option>

<option value="Odd &lt;folder&gt; &amp; co">Odd &lt;folder&gt; &amp; co</option>

    </select>
    
  </div>
  <p class="flex gap-2 text-xs text-muted-foreground">
    <svg class="lucide lucide-eye-off mt-0.5 size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
    Shadow mode: records the correction for the router, learned rules and kNN. The message stays where it is.
  </p>
  <div class="flex flex-wrap gap-2">
    <button type="submit" class="btn" data-size="sm"><svg class="lucide lucide-check " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>Record correction</button>
    <button type="button" class="btn" data-size="sm" data-variant="ghost"
            data-action="cancel-correct">Cancel</button>
  </div>
</form>
