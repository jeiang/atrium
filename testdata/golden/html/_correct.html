



<form class="flex flex-col gap-3 rounded-md border border-dashed bg-background p-3"
      hx-post="/messages/502/correct"
      hx-target="#decision-502"
      hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  <input type="hidden" name="context" value="row">
  <div role="group" class="field" data-invalid>
    <label for="dest-row-502">Where should this go?</label>
    <select id="dest-row-502" name="dest" class="w-full sm:max-w-xs" required autofocus aria-invalid="true" aria-describedby="dest-error-row-502">
      <option value="" disabled>Choose a label</option>
      
<option value="Receipts">Receipts</option>

<option value="Travel|Flights" selected>Travel|Flights</option>

<option value="Odd &lt;folder&gt; &amp; co">Odd &lt;folder&gt; &amp; co</option>

    </select>
    <p id="dest-error-row-502" role="alert">Choose a folder &lt;script&gt;alert(&#34;xss&#34;)&lt;/script&gt;</p>
  </div>
  <p class="flex gap-2 text-xs text-muted-foreground">
    <svg class="lucide lucide-zap mt-0.5 size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg>
    Records the correction and moves the message to this label.
  </p>
  <div class="flex flex-wrap gap-2">
    <button type="submit" class="btn" data-size="sm"><svg class="lucide lucide-check " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>Record correction</button>
    <button type="button" class="btn" data-size="sm" data-variant="ghost"
            data-action="cancel-correct">Cancel</button>
  </div>
</form>
