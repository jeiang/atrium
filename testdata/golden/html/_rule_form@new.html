

<form id="rule-form" method="post" action="/rules" class="flex min-w-0 flex-col gap-6">
  <input type="hidden" name="csrf_token" value="csrf-golden-token">
  

  <fieldset class="fieldset">
    <legend>Rule</legend>
    <div class="grid gap-4 sm:grid-cols-2">
      <div role="group" class="field">
        <label for="rule-id">Name</label>
        
        <input id="rule-id" name="id" type="text" value="" placeholder="Generated if empty" autocomplete="off" spellcheck="false" class="font-mono" aria-describedby="rule-id-help">
        <p id="rule-id-help">Shown in Decisions when this rule decides.</p>
        
      </div>
      <div role="group" class="field">
        <label for="rule-account">Account</label>
        <select id="rule-account" name="account" class="w-full">
          <option value="">All accounts</option>
          <option value="icloud">icloud</option><option value="gmail">gmail</option>
        </select>
      </div>
      <fieldset class="fieldset gap-2">
        <legend data-variant="label">Action</legend>
        <div role="radiogroup" aria-label="Action" class="flex gap-4">
          <div role="group" class="field" data-orientation="horizontal">
            <input id="action-file" type="radio" name="action" value="file">
            <label for="action-file" class="font-normal">File into</label>
          </div>
          <div role="group" class="field" data-orientation="horizontal">
            <input id="action-delete" type="radio" name="action" value="delete" checked>
            <label for="action-delete" class="font-normal">Delete</label>
          </div>
        </div>
      </fieldset>
      <div role="group" class="field [form:has(#action-delete:checked)_&]:hidden">
        <label for="rule-dest">Destination</label>
        <select id="rule-dest" name="dest" class="w-full">
          <option value="" selected>Choose a folder or label</option>
          
          <optgroup label="icloud">
            <option value="Receipts">Receipts</option><option value="Odd &lt;folder&gt; &amp; co">Odd &lt;folder&gt; &amp; co</option>
          </optgroup>
          
          <optgroup label="gmail">
            <option value="Travel|Flights">Travel|Flights</option>
          </optgroup>
          
        </select>
      </div>
    </div>
  </fieldset>

  <fieldset class="fieldset group/conditions">
    <legend>Conditions</legend>
    <p>A message matches when every condition holds. Values compare without regard to case.</p>
    <div class="hidden gap-2 px-0 text-xs font-medium text-muted-foreground sm:group-has-[#conditions>li]/conditions:grid sm:grid-cols-[--spacing(44)_--spacing(44)_minmax(0,1fr)_--spacing(9)]" aria-hidden="true">
      <span>Field</span><span>Operator</span><span>Value</span><span></span>
    </div>
    <ol id="conditions" class="flex flex-col gap-2" role="list" aria-label="Conditions">
      
    </ol>
    <div class="flex flex-wrap items-center gap-2">
      <button id="add-condition" type="button" class="btn" data-size="sm" data-variant="outline" hx-get="/rules/condition?focus=field" hx-target="#conditions" hx-swap="beforeend"><svg class="lucide lucide-plus " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add condition</button>
    </div>
    
    <div class="flex flex-col gap-2 rounded-md bg-muted/60 p-3 not-has-[li]:hidden">
      <p class="text-xs font-medium text-muted-foreground">From the message: add a condition</p>
      <ul class="flex flex-wrap gap-2" role="list">
        
        
        <li class="max-w-full min-w-0">
          <button type="button" class="btn h-auto max-w-full flex-wrap justify-start gap-x-1.5 py-1 text-left font-normal whitespace-normal" data-size="sm" data-variant="outline"
                  hx-get="/rules/condition?field=from_addr&amp;op=eq&amp;value=no-reply%40shop.example" hx-target="#conditions" hx-swap="beforeend"
                  data-suggestion>
            <svg class="lucide lucide-plus " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="font-medium">From address</span>
<span class="text-muted-foreground">is</span>
<code class="rounded-sm bg-muted px-1 py-0.5 font-mono text-xs break-all">no-reply@shop.example</code>
          </button>
        </li>
        
        
        <li class="max-w-full min-w-0">
          <button type="button" class="btn h-auto max-w-full flex-wrap justify-start gap-x-1.5 py-1 text-left font-normal whitespace-normal" data-size="sm" data-variant="outline"
                  hx-get="/rules/condition?field=from_domain&amp;op=suffix&amp;value=shop.example" hx-target="#conditions" hx-swap="beforeend"
                  data-suggestion>
            <svg class="lucide lucide-plus " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="font-medium">From domain</span>
<span class="text-muted-foreground">is or ends in domain</span>
<code class="rounded-sm bg-muted px-1 py-0.5 font-mono text-xs break-all">shop.example</code>
          </button>
        </li>
        
        
        <li class="max-w-full min-w-0">
          <button type="button" class="btn h-auto max-w-full flex-wrap justify-start gap-x-1.5 py-1 text-left font-normal whitespace-normal" data-size="sm" data-variant="outline"
                  hx-get="/rules/condition?field=subject_tmpl&amp;op=eq&amp;value=Your+receipt+%23%3Cn%3E+%3Cscript%3Ealert%28%22xss%22%29%3C%2Fscript%3E" hx-target="#conditions" hx-swap="beforeend"
                  data-suggestion>
            <svg class="lucide lucide-plus " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="font-medium">Subject template</span>
<span class="text-muted-foreground">is</span>
<code class="rounded-sm bg-muted px-1 py-0.5 font-mono text-xs break-all">Your receipt #&lt;n&gt; &lt;script&gt;alert(&#34;xss&#34;)&lt;/script&gt;</code>
          </button>
        </li>
        
        
        <li class="max-w-full min-w-0">
          <button type="button" class="btn h-auto max-w-full flex-wrap justify-start gap-x-1.5 py-1 text-left font-normal whitespace-normal" data-size="sm" data-variant="outline"
                  hx-get="/rules/condition?field=list_id&amp;op=present&amp;value=" hx-target="#conditions" hx-swap="beforeend"
                  data-suggestion>
            <svg class="lucide lucide-plus " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="font-medium">List-Id</span>
<span class="text-muted-foreground">is present</span>
          </button>
        </li>
        
      </ul>
    </div>
    
  </fieldset>

  <div class="flex flex-wrap gap-2 border-t pt-4">
    <button type="submit" class="btn"><svg class="lucide lucide-check " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>Create rule</button>
    <a class="btn" data-variant="outline" href="/rules">Cancel</a>
  </div>
</form>
