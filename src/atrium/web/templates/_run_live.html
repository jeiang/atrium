{% from "_icons.html" import icon %}
<li id="run-{{ run_id }}" class="flex flex-col gap-2 ps-10 text-xs" data-live-run="{{ run_id }}" data-thread="{{ thread_id }}" data-after="{{ after }}"
    hx-get="/chat/{{ thread_id }}/runs/{{ run_id }}?after={{ after }}" hx-trigger="run-done" hx-swap="outerHTML">
  <details class="activity" open>
    <summary class="flex cursor-pointer items-center gap-2 text-muted-foreground" role="status" data-live-status>{{ icon("loader-circle", "size-3.5 animate-spin") }}<span data-live-label>thinking…</span></summary>
    <ol class="mt-2 flex flex-col gap-1.5 border-s ps-3" data-live-steps></ol>
  </details>
  <div class="-ms-10 flex gap-3" data-live-answer hidden>
    <span class="mt-1 grid size-7 shrink-0 place-items-center rounded-full bg-primary text-primary-foreground" aria-hidden="true">{{ icon("bot", "size-4") }}</span>
    <div class="min-w-0 flex-1 px-1 py-2 text-sm whitespace-pre-wrap break-words" data-live-text></div>
  </div>
</li>
