{% for e in entries %}
{% include "_activity_row.html" %}
{% else %}
{% if not offset %}
<li class="px-4 py-10 text-center text-sm text-muted-foreground">Nothing{% if category %} in {{ category }}{% endif %} has been changed yet.</li>
{% endif %}
{% endfor %}
{% if next_offset %}
<li id="load-more" class="flex justify-center px-4 py-3">
  <button type="button" class="btn" data-size="sm" data-variant="outline"
          hx-get="/activity?{{ {'category': category, 'offset': next_offset} | urlencode }}"
          hx-target="closest li" hx-swap="outerHTML" hx-push-url="false">Show older</button>
</li>
{% endif %}
