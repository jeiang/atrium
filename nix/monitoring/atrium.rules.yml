groups:
  - name: atrium
    rules:
      - alert: AtriumMetricsAbsent
        expr: absent(atrium_budget_monthly_usd)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: atrium's ops listener is not being scraped or atrium-web is down.
      - alert: AtriumNotReady
        expr: atrium_readiness_check_ok == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "atrium readiness check {{ $labels.check }} is failing."
      - alert: AtriumPassStale
        expr: atrium_job_stale == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "atrium pass {{ $labels.pass }} failed or has not succeeded within its limit."
      - alert: AtriumMailSyncStale
        expr: time() - atrium_job_last_success_timestamp_seconds{pass="sync"} > 3 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: atrium has not synced mail successfully for more than 3 hours.
      - alert: AtriumBudgetHigh
        expr: atrium_budget_spent_ratio >= 0.8
        labels:
          severity: warning
        annotations:
          summary: "atrium has spent {{ $value | humanizePercentage }} of its monthly budget; scheduled runs pause at 80%."
      - alert: AtriumBudgetExhausted
        expr: atrium_budget_spent_ratio >= 1
        labels:
          severity: critical
        annotations:
          summary: atrium has spent its monthly budget; chat is paused.
      - alert: AtriumLockTimeouts
        expr: increase(atrium_db_exclusive_timeouts_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: atrium timed out waiting for the database lock in the last hour.
      - alert: AtriumToolFailureRate
        expr: sum(rate(atrium_tool_calls_total{ok="false"}[15m])) / clamp_min(sum(rate(atrium_tool_calls_total[15m])), 0.001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "more than 20% of atrium tool calls failed over the last 15 minutes."
      - alert: AtriumNotificationFailures
        expr: increase(atrium_notification_delivery_total{ok="false"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "atrium notification delivery failed {{ $value }} times in the last 15 minutes."
      - alert: AtriumQueueBacklog
        expr: max(atrium_queue_depth) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "atrium queue {{ $labels.queue }} has held more than 100 items for 30 minutes."
      - alert: AtriumIntegrationUnhealthy
        expr: atrium_integration_state{state=~"failing|needs_reauth|expiring"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "atrium integration {{ $labels.integration }} is {{ $labels.state }}."
      - alert: AtriumMailSyncSlow
        expr: histogram_quantile(0.9, sum by (le) (rate(atrium_mail_sync_duration_seconds_bucket[30m]))) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "atrium mail sync p90 is above 5 minutes."
      - alert: AtriumRunFailures
        expr: increase(atrium_runs_total{state="failed"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "atrium agent runs failed {{ $value }} times in the last hour."
      - alert: AtriumEmbedFailures
        expr: increase(atrium_embed_requests_total{ok="false"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "atrium embedding requests failed {{ $value }} times in the last 15 minutes."
